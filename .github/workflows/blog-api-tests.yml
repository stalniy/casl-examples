name: Blog API tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Check Blog API paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check changed paths
        id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: | # shell
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- \
              'fixtures/blog/**' \
              'packages/express-blog/**' \
              'packages/feathersjs-blog/**' \
              'packages/fastify-ucast-sql-blog/**' \
              'packages/fastify-prisma-blog/**' \
              'pnpm-workspace.yaml' \
              'pnpm-lock.yaml' \
              'package.json' \
              '.github/actions/blog-api-tests/**' \
              '.github/workflows/blog-api-tests.yml')
          if [ -n "$changed" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  express-contract:
    needs: changes
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: express-blog
            package: express-blog
            mongodb: true
            database: mongodb://root:blogpwd@localhost:27017/blog?authSource=admin&retryWrites=true&w=majority
          - name: fastify-prisma-blog
            package: fastify-prisma-blog
            mongodb: true
            database: mongodb://root:blogpwd@localhost:27017/blog?authSource=admin&retryWrites=true&w=majority
          - name: feathersjs-blog
            package: feathersjs-blog
            mongodb: true
            database: mongodb://root:blogpwd@localhost:27017/blog?authSource=admin&retryWrites=true&w=majority
          - name: fastify-ucast-sql-blog (MikroORM)
            package: fastify-ucast-sql-blog
            mongodb: false
            implementation: mikro
            database: ./blog-mikro.sqlite
          - name: fastify-ucast-sql-blog (TypeORM)
            package: fastify-ucast-sql-blog
            mongodb: false
            implementation: typeorm
            database: ./blog-typeorm.sqlite
          - name: fastify-ucast-sql-blog (Sequelize)
            package: fastify-ucast-sql-blog
            mongodb: false
            implementation: sequelize
            database: ./blog-sequelize.sqlite
          - name: fastify-ucast-sql-blog (Objection)
            package: fastify-ucast-sql-blog
            mongodb: false
            implementation: objection
            database: ./blog-objection.sqlite
          - name: fastify-ucast-sql-blog (Drizzle 1.0.0-rc.5)
            package: fastify-ucast-sql-blog
            mongodb: false
            implementation: drizzle-v1
            database: ./blog-drizzle-v1.sqlite
    env:
      DATABASE_URL: ${{ matrix.database }}
      MONGODB_URI: ${{ matrix.database }}
      AUTH_SECRET: ci-blog-secret
      SERVER_PORT: 3000
      IMPLEMENTATION: ${{ matrix.implementation }}
      API_PACKAGE: ${{ matrix.package }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Blog API tests
        if: needs.changes.outputs.changed == 'true'
        uses: ./.github/actions/blog-api-tests
        with:
          mongodb: ${{ matrix.mongodb }}
