packages:
  - packages/**

allowBuilds:
  '@parcel/watcher': false
  '@prisma/client': true
  '@prisma/engines': true
  better-sqlite3: true
  sqlite3: true
  esbuild: false
  fsevents: set this to true or false
  lmdb: false
  msgpackr-extract: false
  nodemon: set this to true or false
  prisma: true

minimumReleaseAgeExclude:
  - "@casl/ability"
  - "@casl/angular"
  - "@casl/mongoose"
  - "@casl/react"
  - "@casl/vue"
  - "@casl/prisma"
  - "@ucast/sql"

# Passport middleware uses the Express 5 request types in this workspace.
overrides:
  "mongodb-connection-string-url": "7.0.2"
  "@types/passport>@types/express": "^5.0.0"
  "@types/passport-strategy>@types/express": "^5.0.0"
