name: Blog API tests
description: Run blog api tests using the workflow environment
inputs:
  mongodb:
    description: Whether the API uses MongoDB instead of SQLite
    required: true
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: 11.4.0
        standalone: true

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version-file: package.json
        cache: pnpm

    - name: Install API and test dependencies
      shell: bash
      run: pnpm --filter "./packages/$API_PACKAGE" --filter ./packages/express-blog install --frozen-lockfile

    - name: Start MongoDB and seed fixtures
      if: ${{ inputs.mongodb == 'true' }}
      working-directory: packages/express-blog
      shell: bash
      run: | # shell
        docker compose up -d
        ready=false
        for ((attempt = 0; attempt < 60; attempt++)); do
          if docker compose exec -T mongo mongo --quiet \
            --host localhost -u root -p blogpwd --authenticationDatabase admin \
            --eval 'quit(db.isMaster().ismaster ? 0 : 1)'; then
            ready=true
            break
          fi
          sleep 2
        done
        if [ "$ready" != true ]; then
          echo "MongoDB did not become a writable replica-set primary"
          exit 1
        fi
        pnpm seed

    - name: Prepare SQLite fixtures
      if: ${{ inputs.mongodb != 'true' }}
      working-directory: packages/fastify-ucast-sql-blog
      shell: bash
      run: | # shell
        pnpm "schema:$IMPLEMENTATION"
        pnpm "seed:$IMPLEMENTATION"

    - name: Run Express API contract tests
      shell: bash
      run: | # shell
        pnpm --dir "packages/$API_PACKAGE" start > "$RUNNER_TEMP/blog-api.log" 2>&1 &
        server_pid=$!
        cleanup() {
          kill "$server_pid" 2>/dev/null || true
          cat "$RUNNER_TEMP/blog-api.log"
        }
        trap cleanup EXIT

        ready=false
        for ((attempt = 0; attempt < 60; attempt++)); do
          if curl --fail --silent --output /dev/null --max-time 2 http://localhost:3000/api/articles; then
            ready=true
            break
          fi
          if ! kill -0 "$server_pid" 2>/dev/null; then
            echo "API exited before becoming ready"
            exit 1
          fi
          sleep 1
        done
        if [ "$ready" != true ]; then
          echo "API did not become ready"
          exit 1
        fi
        pnpm --dir packages/express-blog test:server

    - name: Show MongoDB logs on failure
      if: ${{ failure() && inputs.mongodb == 'true' }}
      working-directory: packages/express-blog
      shell: bash
      run: docker compose logs

    - name: Stop MongoDB
      if: ${{ always() && inputs.mongodb == 'true' }}
      working-directory: packages/express-blog
      shell: bash
      run: docker compose down --volumes
