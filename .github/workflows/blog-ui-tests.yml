name: Blog UI tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Check Blog UI paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed paths
        id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: | # shell
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- \
              'fixtures/blog/**' \
              'packages/react-blog/**' \
              'packages/vue-blog/**' \
              'packages/fastify-ucast-sql-blog/**' \
              'packages/ui-tests/**' \
              'pnpm-lock.yaml' \
              'pnpm-workspace.yaml' \
              'package.json' \
              '.github/actions/blog-ui-tests/**' \
              '.github/workflows/blog-ui-tests.yml')
          if [ -n "$changed" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  blog-contract:
    needs: changes
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app:
          - react-blog
          - vue-blog
    env:
      BLOG_APP: ${{ matrix.app }}
      IMPLEMENTATION: mikro
      DATABASE_URL: ./blog-ci.sqlite
      AUTH_SECRET: ci-blog-secret
      SERVER_PORT: 3000
      API_PROXY_TARGET: http://127.0.0.1:3000
      VITE_API_URL: /api
      PLAYWRIGHT_BASE_URL: http://localhost:8080
      PLAYWRIGHT_BLOG_API_URL: http://127.0.0.1:3000/api

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Blog UI tests
        if: needs.changes.outputs.changed == 'true'
        uses: ./.github/actions/blog-ui-tests
