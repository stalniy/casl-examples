packages:
  - packages/**

allowBuilds:
  '@parcel/watcher': false
  '@prisma/client': true
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: false
  fsevents: set this to true or false
  lmdb: false
  msgpackr-extract: false
  nodemon: set this to true or false
  prisma: true

minimumReleaseAgeExclude:
  - "@casl/ability"
  - "@casl/angular"
  - "@casl/mongoose"
  - "@casl/react"
  - "@casl/vue"
  - "@casl/prisma"
