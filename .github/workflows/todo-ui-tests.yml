name: Todo UI tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Check Todo UI paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed paths
        id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: | # shell
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- \
              'packages/angular-todo/**' \
              'packages/react-todo/**' \
              'packages/vue-todo/**' \
              'packages/ui-tests/**' \
              'pnpm-workspace.yaml' \
              'pnpm-lock.yaml' \
              'package.json' \
              '.github/actions/todo-ui-tests/**' \
              '.github/workflows/todo-ui-tests.yml')
          if [ -n "$changed" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  todo-contract:
    needs: changes
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app:
          - angular-todo
          - react-todo
          - vue-todo
    env:
      TODO_APP: ${{ matrix.app }}
      PLAYWRIGHT_BASE_URL: http://localhost:8080

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Todo UI tests
        if: needs.changes.outputs.changed == 'true'
        uses: ./.github/actions/todo-ui-tests
