packages:
  - packages/**

allowBuilds:
  '@parcel/watcher': set this to true or false
  '@prisma/client': set this to true or false
  '@prisma/engines': set this to true or false
  esbuild: set this to true or false
  fsevents: set this to true or false
  lmdb: set this to true or false
  msgpackr-extract: set this to true or false
  nodemon: set this to true or false
  prisma: set this to true or false

minimumReleaseAgeExclude:
  - "@casl/ability"
  - "@casl/angular"
  - "@casl/mongoose"
  - "@casl/react"
  - "@casl/vue"
  - "@casl/prisma"
